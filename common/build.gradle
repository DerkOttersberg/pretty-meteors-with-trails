plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    def seamlessApiCommon = files(rootProject.file("../seamless-api/common/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-common.jar"))
    seamlessApiCommon.builtBy gradle.includedBuild('seamless-api').task(':common:jar')
    api seamlessApiCommon
    compileOnly libs.mixin
    compileOnly libs.fabric.loader
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}
tasks.named('jar', Jar) { archiveFileName = "${rootProject.archives_base_name}-${project.version}-common.jar" }
tasks.named('sourcesJar', Jar) { archiveFileName = "${rootProject.archives_base_name}-${project.version}-common-sources.jar" }
