plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

apply from: rootProject.file('gradle/empty-gametest-structure.gradle')

dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    neoForge libs.neoforge
    def seamlessApiNeoForge = files(rootProject.file("../seamless-api/neoforge/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-neoforge-dev.jar"))
    seamlessApiNeoForge.builtBy gradle.includedBuild('seamless-api').task(':neoforge:jar')
    implementation seamlessApiNeoForge
}
loom {
    mods {
        prettymeteors {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            runDir 'build/gametest'
            property 'neoforge.enabledGameTestNamespaces', 'prettymeteors'
        }
    }
}

tasks.named('runGameTestServer') {
    doLast {
        def logFile = layout.buildDirectory.file('gametest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 2) {
            throw new GradleException('NeoForge GameTest run did not discover the Pretty Meteors scenario')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadataProperties = [mod_version: project.version.toString(), neo_version_range: '[21.1.255,21.2)', minecraft_version_range: '[1.21.1]']
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-sources.jar"
}

 tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge.jar" }
tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-sources.jar" }
