name: build

on:
  push:
    branches: [main, '26.2', '26.3', 'port/**', 'support/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/pretty-meteors-with-trails
      - uses: gradle/actions/wrapper-validation@v4

  loader-builds:
    name: loader-builds (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: fabric
            loader: fabric
            gradle_args: -PfabricApiVersion=0.161.0+26.3
          - lane: forge
            loader: forge
            gradle_args: ''
          - lane: neoforge
            loader: neoforge
            gradle_args: ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/pretty-meteors-with-trails
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/pretty-meteors-with-trails
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: aa8e793995b0deaa85f5283e3056eb702bc8611a
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build ${{ matrix.gradle_args }}
      - name: Upload ${{ matrix.lane }} reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretty-meteors-${{ matrix.lane }}-reports
          if-no-files-found: ignore
          path: |
            suite/pretty-meteors-with-trails/**/build/reports/**
            suite/pretty-meteors-with-trails/**/build/test-results/**
            suite/pretty-meteors-with-trails/**/build/run/**/logs/**
            suite/pretty-meteors-with-trails/**/build/**/crash-reports/**
            suite/pretty-meteors-with-trails/**/run/**/crash-reports/**
            suite/pretty-meteors-with-trails/**/build/gametest/logs/**

  verification:
    needs: [wrapper-validation, loader-builds]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/pretty-meteors-with-trails
    steps:
      - name: Require successful protected prerequisite jobs
        env:
          WRAPPER_VALIDATION_RESULT: ${{ needs.wrapper-validation.result }}
          LOADER_BUILDS_RESULT: ${{ needs.loader-builds.result }}
        run: |
          if [[ "$WRAPPER_VALIDATION_RESULT" != "success" || "$LOADER_BUILDS_RESULT" != "success" ]]; then
            echo "Required jobs failed: wrapper-validation=$WRAPPER_VALIDATION_RESULT loader-builds=$LOADER_BUILDS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: suite/pretty-meteors-with-trails
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: aa8e793995b0deaa85f5283e3056eb702bc8611a
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check build
      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretty-meteors-verification-reports
          if-no-files-found: ignore
          path: |
            suite/pretty-meteors-with-trails/**/build/reports/**
            suite/pretty-meteors-with-trails/**/build/test-results/**
            suite/pretty-meteors-with-trails/**/build/run/**/logs/**
            suite/pretty-meteors-with-trails/**/build/**/crash-reports/**
            suite/pretty-meteors-with-trails/**/run/**/crash-reports/**
            suite/pretty-meteors-with-trails/**/build/gametest/logs/**
