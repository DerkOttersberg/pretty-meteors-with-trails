name: build

on:
  push:
    branches: ['1.21.1', 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: pretty-meteors-with-trails

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pretty-meteors-with-trails
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '6bb9de09ed9e01c1b7614149e6eb2e5e461d367e'
          path: seamless-api
      - uses: gradle/actions/wrapper-validation@v4

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pretty-meteors-with-trails
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '6bb9de09ed9e01c1b7614149e6eb2e5e461d367e'
          path: seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretty-meteors-with-trails-${{ matrix.loader }}-reports
          if-no-files-found: ignore
          path: |
            pretty-meteors-with-trails/**/build/reports/**
            pretty-meteors-with-trails/**/build/test-results/**
            pretty-meteors-with-trails/**/logs/**
            pretty-meteors-with-trails/**/crash-reports/**

  verification:
    needs: [wrapper-validation, loader-builds]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pretty-meteors-with-trails
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '6bb9de09ed9e01c1b7614149e6eb2e5e461d367e'
          path: seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon clean check build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretty-meteors-with-trails-verification
          if-no-files-found: ignore
          path: |
            pretty-meteors-with-trails/**/build/reports/**
            pretty-meteors-with-trails/**/build/test-results/**
            pretty-meteors-with-trails/fabric/build/libs/*
            pretty-meteors-with-trails/forge/build/libs/*
            pretty-meteors-with-trails/neoforge/build/libs/*
