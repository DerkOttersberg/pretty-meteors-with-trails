plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

configurations.forgeRuntimeLibrary {
    exclude group: 'dev.architectury', module: 'architectury-naming-service'
    exclude group: 'dev.architectury', module: 'architectury-mixin-remapper-service'
}

dependencies {
    minecraft libs.minecraft
    forge libs.forge
    def seamlessApiForge = files(rootProject.file("../seamless-api/forge/build/libs/seamless-api-${libs.versions.seamless.api.get()}-forge.jar"))
    seamlessApiForge.builtBy gradle.includedBuild('seamless-api').task(':forge:jar')
    implementation seamlessApiForge
}
def gameTestModRoot = layout.buildDirectory.dir('gametest-mod')
loom {
    mods {
        prettymeteors {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            environmentVariable 'MOD_CLASSES', "prettymeteors%%${gameTestModRoot.get().asFile.absolutePath}"
            runDir 'build/gametest'
            // Forge 65's GameTest template omits the mapping properties that Loom's
            // development services still require. This project uses official names on
            // both sides, so an explicit identity mapping is sufficient and stable.
            def identityMappings = rootProject.file('gradle/official-named-empty.tiny').absolutePath
            property 'architectury.naming.mappingsPath', identityMappings
            property 'architectury.naming.sourceNamespace', 'official'
            property 'architectury.mixinRemapper.mappingsPath', identityMappings
            property 'architectury.mixinRemapper.sourceNamespace', 'official'
            property 'forge.enabledGameTestNamespaces', 'prettymeteors'
        }
    }
}

def stageGameTestMod = tasks.register('stageGameTestMod', Sync) {
    dependsOn tasks.named('classes'), tasks.named('gametestClasses')
    from sourceSets.main.output
    from sourceSets.gametest.output
    into gameTestModRoot
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('runGameTestServer') {
    dependsOn stageGameTestMod
    // Keep the classpath consistent with the explicit run source-mod root above.
    def sourceRoots = (sourceSets.main.output.files + sourceSets.gametest.output.files) as Set
    classpath = files(gameTestModRoot) + classpath.filter { !sourceRoots.contains(it) }
    doLast {
        def logFile = layout.buildDirectory.file('gametest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 2) {
            throw new GradleException('Forge GameTest run did not discover the Pretty Meteors scenario')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadataProperties = [mod_version: project.version.toString(), loader_version_range: '[66,)', forge_version_range: '[66.0.9,67)', minecraft_version_range: '[26.3,26.4)']
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.derkottersberg.prettymeteors',
                'MixinConfigs': 'prettymeteors.mixins.json'
        )
    }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
