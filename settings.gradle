pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

gradle.beforeProject { project ->
    if (project.name == 'forge') {
        project.ext.set('loom.platform', 'forge')
    } else if (project.name == 'neoforge') {
        project.ext.set('loom.platform', 'neoforge')
    } else {
        project.ext.set('loom.platform', 'fabric')
    }
}

rootProject.name = 'pretty-meteors-with-trails'
include 'common', 'fabric', 'forge', 'neoforge'

// The API build remains an independent composite so loader jars can be rebuilt
// directly from its checked-out source without publishing them first.
includeBuild('../seamless-api')
